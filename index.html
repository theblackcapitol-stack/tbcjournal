<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<script>try{if(localStorage.getItem("tj_theme")==="light"){document.documentElement.setAttribute("data-theme","light");document.querySelector('meta[name="theme-color"]').setAttribute("content","#ffffff")}}catch(e){}</script>
<title>Trade Journal &amp; Game Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:dark;
  --bg:#000;--panel:#0e0e0e;--panel2:#151515;--field:#191919;--line:#242424;--line2:#323232;
  --text:#f4f4f5;--muted:#8d8d92;--dim:#5c5c61;--win:#7090ff;--loss:#ef4d56;--warn:#e5b04a;
  --r-lg:22px;--r-md:14px;--r-sm:10px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
:root:not([data-theme="light"]),:root[data-theme="dark"]{color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;-webkit-appearance:none;appearance:none;text-align:center;line-height:1.2}
.btn[disabled]{opacity:.4;cursor:default}
:focus-visible{outline:2px solid var(--win);outline-offset:2px}
img{max-width:100%}
.hide{display:none!important}
.pos{color:var(--win)}.neg{color:var(--loss)}.mut{color:var(--muted)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--panel);font-weight:500;white-space:nowrap}
.btn:hover{border-color:#4a4a4f}
.btn.sm{height:36px;padding:0 13px;font-size:14px;border-radius:var(--r-sm)}
.btn.primary{background:#fff;color:#000;border-color:#fff}
.btn.danger{color:var(--loss)}
.cta{display:inline-flex;align-items:center;gap:16px;height:58px;padding:0 8px 0 24px;border-radius:18px;background:linear-gradient(#fff,#e9e9ea);color:#000;font-size:18px;font-weight:500}
.cta .arr{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#e2e2e4;font-size:20px}
.cta:hover .arr{background:#d6d6d9}

/* ---------- inputs ---------- */
.lbl{display:block;color:var(--muted);font-size:15px;margin:0 0 12px}
.field{height:56px;width:100%;padding:0 18px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--field);font-size:17px}
.field::placeholder{color:var(--dim)}
textarea.field{height:auto;min-height:120px;padding:16px 18px;resize:vertical;line-height:1.5}
textarea.field.big{min-height:200px}
.field:focus{outline:none;border-color:#6a6a70}
input[type=date].field,input[type=time].field{color-scheme:dark}
.inwrap{position:relative}
.inwrap .pre{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
.inwrap .suf{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:17px}
.inwrap .field.haspre{padding-left:38px}
.inwrap .field.hassuf{padding-right:40px}
select.field{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:12px}
.chip{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;height:56px;padding:0 22px;border:1px solid var(--line2);border-radius:var(--r-md);font-size:17px;background:transparent;white-space:nowrap;transition:background .14s,color .14s,border-color .14s}
.chip:hover{border-color:#4d4d52}
.chip.on{background:#fff;color:#000;border-color:#fff}
.chip.ins{min-width:96px}
.chips.inst{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:12px;max-width:920px}
.chips.inst .chip,.chips.inst .chip-input{width:100%;min-width:0;padding:0 10px}
.chip.own{color:var(--muted)}
.chip .x{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:#2c2c30;color:#ddd;font-size:12px;line-height:20px;text-align:center;display:none}
.chip:hover .x,.chip:focus-visible .x{display:block}
@media (hover:none){.chip .x,.thumb .del{display:block!important}}
.anagrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 14px;max-width:920px}
.ana-dd{min-width:0}
.ana-add{margin-top:10px;border-style:dashed}
.ana-rm{display:inline-block;margin-top:8px;font-size:13.5px;color:var(--muted)}
.chip.ck .tick{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:-4px;border:1.5px solid var(--line2);border-radius:5px}
.chip.ck.on .tick{border-color:#000}
.chip.ck .tick svg{width:14px;height:14px}
.chip-input{height:56px;width:170px;padding:0 16px;border:1px dashed #555;border-radius:var(--r-md);background:var(--field);font-size:16px}

/* segmented (grey active) */
.seg{display:flex;padding:6px;gap:4px;border:1px solid var(--line2);border-radius:16px;background:var(--panel)}
.seg button{flex:1;min-width:0;height:52px;padding:0 6px;border-radius:11px;color:var(--muted);font-size:17px;white-space:nowrap;transition:background .14s,color .14s}
.seg button.on{background:#222225;color:var(--text)}
/* tabs (white active) */
.tabs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:4px;gap:3px;border:1px solid var(--line2);border-radius:16px;background:var(--panel)}
.tabs button{min-width:0;height:46px;border-radius:12px;color:var(--muted);font-size:16px;white-space:nowrap;transition:background .14s,color .14s}
.tabs button.on{background:#fff;color:#000}
.tabs button .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--win);margin-left:5px;vertical-align:middle}
/* underline tabs */
.utabs{display:flex;gap:30px;margin-bottom:20px;flex-wrap:wrap}
.utabs button{padding:6px 0;color:var(--muted);font-size:17px;border-bottom:2px solid transparent}
.utabs button.on{color:var(--text);border-color:var(--text)}

.yn{display:flex;gap:14px;flex-wrap:wrap}
.yn button{display:flex;align-items:center;justify-content:center;gap:12px;width:220px;max-width:calc(50% - 7px);height:62px;border:1px solid var(--line2);border-radius:var(--r-md);font-size:18px;background:transparent}
.yn button.on{background:#fff;color:#000;border-color:#fff}
.yn.big button{flex:1;max-width:320px;height:62px;border-radius:var(--r-md);font-size:17px}
.yn svg{width:22px;height:22px}

/* ---------- loading ---------- */
.loading{min-height:100vh;display:grid;place-items:center;color:var(--muted)}

/* ---------- home ---------- */
.home{max-width:1320px;margin:0 auto;padding:28px 28px 80px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:6px 0 28px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:600}
.logo{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#1f1f22;border:1px solid var(--line2);font-size:13px;font-weight:700;letter-spacing:-.02em}
.top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:20;min-width:260px;padding:6px;border:1px solid var(--line2);border-radius:var(--r-md);background:#121214;box-shadow:0 18px 40px rgba(0,0,0,.6)}
.menu button{display:block;width:100%;text-align:left;padding:11px 12px;border-radius:9px}
.menu button:hover{background:#1e1e21}
.menu small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;margin-bottom:22px}
.stat{background:var(--panel);padding:22px 24px}
.stat .k{color:var(--muted);font-size:14px}
.stat .v{font-size:30px;font-weight:600;letter-spacing:-.02em;margin-top:6px;font-variant-numeric:tabular-nums}
.stat.lead .v{font-size:46px;line-height:1.05}
.stat .s{color:var(--muted);font-size:13px;margin-top:4px}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.filters select.field{height:42px;width:auto;min-width:150px;font-size:14px;border-radius:var(--r-sm)}
.filters .count{margin-left:auto;color:var(--muted);font-size:14px}
.tablewrap{border:1px solid var(--line);border-radius:var(--r-lg);overflow-x:auto;background:var(--panel)}
table{width:100%;border-collapse:collapse;min-width:980px}
th{font-weight:500;color:var(--muted);font-size:13px;text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 16px;border-bottom:1px solid var(--line);white-space:nowrap;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:#141416}
td.num,th.num{text-align:right}
.tk{font-weight:600}
.dirb{display:inline-block;margin-left:8px;padding:1px 7px;border:1px solid var(--line2);border-radius:6px;font-size:12px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 11px;border:1px solid var(--line2);border-radius:9px;background:#141416;font-size:14px}
.pill i{width:8px;height:8px;border-radius:2.5px;background:#ddd}
.pill.good i{background:#e6e6e6}.pill.bad i{background:var(--loss)}
.rowact{display:flex;gap:4px;justify-content:flex-end}
.icobtn{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--muted)}
.icobtn:hover{background:#1e1e21;color:var(--text)}
.icobtn svg{width:17px;height:17px}
.mlist{display:none;flex-direction:column;gap:10px}
.mcard{display:flex;justify-content:space-between;gap:12px;width:100%;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);text-align:left}
.mc-l{display:flex;flex-direction:column;gap:6px;min-width:0;align-items:flex-start}
.mc-t{display:flex;align-items:center;gap:8px;font-size:17px}
.mc-t .dirb{margin-left:0}
.mc-s{font-size:13.5px;max-width:100%;overflow-wrap:anywhere}
.mc-r{display:flex;flex-direction:column;align-items:flex-end;gap:4px;white-space:nowrap;font-variant-numeric:tabular-nums}
.mc-r b{font-size:18px}
.mc-r span{font-size:14px}
.navtabs{display:flex;gap:3px;margin-left:8px;padding:3px;border:1px solid var(--line2);border-radius:12px;background:var(--panel);overflow-x:auto;max-width:100%;scrollbar-width:none}
.navtabs::-webkit-scrollbar{display:none}
.navtabs button{height:34px;padding:0 14px;border-radius:9px;color:var(--muted);font-size:15px;font-weight:500;white-space:nowrap;transition:background .14s,color .14s}
.navtabs button.on{background:#fff;color:#000}
td.clip{max-width:280px;overflow:hidden;text-overflow:ellipsis}
.duebar{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:22px;background:var(--panel);margin-bottom:16px;overflow:hidden}
.duebar>div{padding:18px 26px;border-left:1px solid var(--line);min-width:0}
.duebar>div:first-child{border-left:0}
.duebar .k{display:block;color:var(--muted);font-size:13.5px}
.duebar b{display:flex;align-items:center;min-height:40px;font-size:clamp(16px,2.2vw,28px);font-weight:700;margin-top:4px;letter-spacing:-.02em;line-height:1.25}
.duebar b.due{white-space:normal}
.st{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;font-size:13px;font-weight:500;letter-spacing:0;background:#141416;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:2px;background:#77777d}
.st.ok i{background:var(--win)}.st.late i{background:var(--loss)}
.st.big{height:32px;font-size:15px;padding:0 12px}
.photos{border:1px solid var(--line2);border-radius:22px;background:var(--panel2);padding:20px;position:sticky;top:20px;container-type:inline-size}
.ph-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:15px}
.ph-h b{font-weight:600}
.photos .dz{aspect-ratio:1.3}
.photos .thumbs{margin:12px 0 0}
.photos .thumb{width:84px;height:56px}
.tabs.sm{margin-top:12px;border-radius:12px;padding:3px}
.tabs.sm button{height:36px;min-width:0;font-size:13.5px;border-radius:9px;padding:0}
.tabs.sm button .dot{margin-left:3px}
.ph-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
.seg.sm{padding:3px;border-radius:12px;width:128px;flex:none}
.seg.sm button{height:34px;font-size:14px;border-radius:9px}
.ph-foot .hint{margin:0;text-align:right}
.datebtn{position:relative;display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:10px 18px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--field);font-size:18px;text-align:left;cursor:pointer}
.datebtn:hover{border-color:#4a4a4f}
.datebtn>svg{width:22px;height:22px;flex:none;color:#bdbdc2}
.datebtn .chev{margin-left:auto;color:var(--muted);display:inline-flex;flex:none}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;color-scheme:dark}
.assetpanel{margin-top:12px;padding:18px;border:1px solid var(--line2);border-radius:16px;background:var(--panel2)}
.selassets{display:flex;flex-wrap:wrap;gap:8px;min-width:0}
.selassets span{padding:2px 10px;border:1px solid var(--line2);border-radius:8px;font-size:16px;background:#232326}
.plink{margin-top:16px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--panel2);font-size:14.5px;max-width:900px}
.plink .ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.plink dl{display:grid;grid-template-columns:170px minmax(0,1fr);gap:6px 14px;margin:12px 0 0}
.plink dl:empty{display:none}
.plink dt{color:var(--muted)}.plink dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.rthumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.rthumbs button{position:relative;width:110px;height:70px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#0a0a0a;cursor:zoom-in}
.rthumbs img{width:100%;height:100%;object-fit:cover;display:block}
.rthumbs .tf{position:absolute;left:5px;bottom:5px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.8);font-size:11px;line-height:17px}
.pqa .rrow .a{font-size:16.5px;white-space:pre-wrap;margin-bottom:4px}
.pqa .rrow .strong{font-size:18px}
.pqa{max-width:1100px}
.savedtxt{font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.warnbox{margin-top:12px;padding:12px 14px;border:1px solid #4a3a1a;border-radius:12px;background:#17130b;color:#e9cf9a;font-size:14.5px}
.warnbox button{color:#fff;text-decoration:underline;margin-left:8px}
.duerow{display:grid;grid-template-columns:110px minmax(0,190px);align-items:center;gap:12px;margin-bottom:10px}
.duerow .field{height:46px;font-size:15px}
.dcard{border:1px solid var(--line);border-radius:24px;background:var(--panel);margin-bottom:18px;overflow:hidden}
.dayhead{padding:26px 30px 8px}
.dh-top{display:flex;align-items:center;gap:18px}
.navbtn{display:grid;place-items:center;width:48px;height:48px;flex:none;border:1px solid var(--line2);border-radius:14px;color:var(--text)}
.navbtn:hover{border-color:#55555a}
.dh-title{display:flex;flex-direction:column;min-width:0}
.dh-title>.mut{font-size:14px}
.dh-date{position:relative;font-size:clamp(30px,3.6vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.1;cursor:pointer;white-space:nowrap}
.dh-date input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;color-scheme:dark}
.dh-right{margin-left:auto;display:flex;gap:10px;align-items:center}
.daytabs{margin:22px 0 4px;max-width:640px}
.daytabs button{height:40px;font-size:14.5px}
.daytabs .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--win);margin-left:6px;vertical-align:middle}
.dh-stats{display:grid;grid-template-columns:minmax(0,2fr) repeat(3,minmax(0,1fr));gap:20px;padding:24px 0;border-top:1px solid var(--line);margin-top:18px}
.dh-stats .k,.dh-grid .k,.eod-res .k{color:var(--muted);font-size:14.5px}
.dh-stats .v{font-size:clamp(26px,2.6vw,34px);font-weight:600;margin-top:6px;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dh-stats .lead .v{font-size:clamp(40px,5vw,64px);font-weight:700;letter-spacing:-.035em;line-height:1.05}
.dh-stats .s,.dh-grid .s{color:var(--muted);font-size:14px;margin-top:6px}
.dh-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;padding:22px 0 24px;border-top:1px solid var(--line)}
.dh-grid .v{font-size:clamp(20px,2vw,28px);font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dc-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 26px;border-bottom:1px solid var(--line);min-height:68px}
.dc-h h2{margin:0;font-size:17px;font-weight:600}
.dc-b{padding:8px 26px 18px}
.dc-b.flush{padding:0}
.dplan+.dplan{border-top:1px solid var(--line2);margin-top:8px;padding-top:8px}
.dplan-h{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 0 6px;font-size:16px}
.dplan-h .linkbtn{display:inline-flex;align-items:center;gap:2px;text-decoration:none;color:var(--muted)}
.dplan-h .linkbtn:hover{color:var(--text)}
.drow{display:grid;grid-template-columns:220px minmax(0,1fr);gap:20px;padding:18px 0;border-bottom:1px solid var(--line)}
.dplan .drow:last-child{border-bottom:0}
.drow .k{color:var(--muted);font-size:15.5px}
.drow .a{font-size:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.drow .sk{color:var(--muted);font-size:13px;margin:10px 0 3px}
.drow .sk:first-child{margin-top:0}
.dempty{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:22px 26px;color:var(--muted)}
.dc-b .dempty{padding:16px 0}
.dtrade{display:grid;grid-template-columns:100px 40px minmax(0,1fr) auto auto auto;align-items:center;gap:16px;width:100%;padding:18px 26px;text-align:left;border-bottom:1px solid var(--line);transition:background .14s}
.dtrade:last-child{border-bottom:0}
.dtrade:hover{background:#141416}
.dt-time{font-weight:600;white-space:nowrap}
.dt-ic{display:grid;place-items:center;width:38px;height:38px;border:1px solid var(--line2);border-radius:11px;color:var(--win)}
.dt-ic.short{color:var(--loss)}
.dt-ic svg{width:18px;height:18px}
.dt-main{display:flex;align-items:baseline;gap:12px;min-width:0;white-space:nowrap;overflow:hidden}
.dt-main b{font-size:18px}
.dt-main .mut{overflow:hidden;text-overflow:ellipsis}
.dt-res{display:flex;flex-direction:column;align-items:flex-end;white-space:nowrap;font-variant-numeric:tabular-nums}
.dt-res b{font-size:18px}
.dt-res span{font-size:14px}
.dt-img{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.eod{display:grid;grid-template-columns:300px minmax(0,1fr);gap:24px;padding:22px 0;border-bottom:1px solid var(--line)}
.eod:last-child{border-bottom:0}
.eod-l{display:flex;flex-direction:column;gap:6px}
.eod-l .mut{font-size:15px}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.24em;font-size:13px;color:#a4a4aa}
.eod textarea.field{min-height:110px}
.eod-res{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:start}
.eod-res .v{font-size:32px;font-weight:700;letter-spacing:-.02em;margin-top:6px}
.eod-res label,.eod-col label{display:block}

.ex-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 8px}

.sec-t{margin:28px 0 12px;font-size:20px;font-weight:600}

.note{color:var(--dim);font-size:13px;margin-top:18px}

/* ---------- wizard ---------- */
.wiz{max-width:1500px;margin:0 auto;padding:20px 24px 40px}
.wiz-top{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;margin-bottom:16px;color:var(--muted)}
.wiz-top>.row{flex-wrap:wrap;justify-content:flex-end}
.topnav{display:inline-flex;gap:8px;padding-left:12px;margin-left:4px;border-left:1px solid var(--line2)}
.frame{display:grid;grid-template-columns:clamp(266px,20vw,292px) minmax(0,1fr);border:1px solid var(--line);border-radius:30px;background:var(--panel);overflow:clip;min-height:calc(100vh - 110px)}
.side{min-width:0;border-right:1px solid var(--line);padding:30px 18px;background:#0c0c0c}
.sumhead{display:flex;align-items:baseline;gap:10px;padding:0 12px 22px;font-size:19px;white-space:nowrap}
.sumhead b{font-weight:600}
.sumhead .res{margin-left:auto;font-size:15.5px;font-weight:500;display:flex;gap:8px}
.steps{list-style:none;margin:0;padding:0;position:relative}
.steps li{position:relative}
.steps li:not(:last-child)::after{content:"";position:absolute;left:31px;top:51px;width:2px;height:22px;border-radius:1px;background:#2a2a2e}
.steps li.done:not(:last-child)::after{background:#56565c}
.steps button{display:flex;align-items:center;gap:14px;width:100%;padding:11px 12px;border:1px solid transparent;border-radius:16px;color:var(--muted);font-size:16px;text-align:left;white-space:nowrap;transition:color .15s,background .15s}
.steps button:hover{color:var(--text)}
.steps .n{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;border:2px solid #2e2e32;font-size:14px;font-weight:600;transition:background .15s,border-color .15s,color .15s}
.steps li.done .n{border-color:#77777d;color:var(--text)}
.steps li.done button{color:#d8d8dc}
.steps li.cur button{background:#161618;border-color:var(--line2);color:var(--text)}
.steps li.cur .n{background:#fff;color:#000;border-color:#fff}
.steps .n svg{width:18px;height:18px}
.main{display:flex;flex-direction:column;min-width:0}
.body.enter>*{animation:enter .22s ease-out both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.body{flex:1;min-width:0;padding:clamp(26px,3vw,44px) clamp(22px,3.2vw,48px) 36px}
.h1{font-size:40px;font-weight:600;letter-spacing:-.025em;margin:0 0 34px;line-height:1.1}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:20px clamp(22px,3.2vw,48px);border-top:1px solid var(--line)}
.foot .btn{height:58px;padding:0 28px;border-radius:16px;font-size:18px}
.foot.head{position:sticky;top:0;z-index:6;border-top:0;border-bottom:1px solid var(--line);background:rgba(14,14,14,.92);-webkit-backdrop-filter:saturate(1.4) blur(10px);backdrop-filter:saturate(1.4) blur(10px);-webkit-backdrop-filter:saturate(1.4) blur(10px);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:12px}
.foot.head .btn{height:46px;padding:0 22px;font-size:16px;border-radius:14px}
.foot.head .cta{height:48px;font-size:16px;padding:0 6px 0 20px;gap:12px;border-radius:15px}
.foot.head .cta .arr{width:36px;height:36px;font-size:17px;border-radius:11px}
.foot .right{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.sec{margin-bottom:34px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px 30px}
.grid2>*{min-width:0}
.row{display:flex;gap:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,420px);gap:clamp(28px,3vw,44px);align-items:start}
.split>*{min-width:0}
.divider{height:1px;background:var(--line);margin:34px 0}
.fields-min{min-height:200px}

/* accounts */
.accts{display:flex;flex-wrap:wrap;gap:16px}
.acct{display:flex;align-items:center;gap:18px;width:400px;max-width:100%;transition:border-color .14s,background .14s;padding:22px 24px;border:1px solid var(--line2);border-radius:18px;text-align:left;background:var(--panel2)}
.acct.on{border:2px solid #fff;padding:21px 23px;background:#1c1c1f}
.acct .ic{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:#0a0a0a;border:1px solid var(--line2);font-weight:700;font-size:17px}
.acct .nm{display:block;font-size:19px;font-weight:600}
.acct .meta{color:var(--muted);font-size:16px;margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
.acct.add{width:auto;align-self:stretch;color:var(--muted);border-style:dashed;justify-content:center;padding:0 26px;min-height:96px}
.typebadge{display:inline-block;padding:0 7px;border-radius:6px;background:#26262a;color:#cfcfd3;font-size:13px;line-height:22px}

/* chart section */
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.thumb{position:relative;width:118px;height:76px;border-radius:12px;overflow:hidden;border:1px solid var(--line2);background:#0a0a0a}
.thumb.on{border:2px solid #fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .tf{position:absolute;left:6px;bottom:6px;padding:0 6px;border-radius:5px;background:rgba(0,0,0,.8);font-size:11.5px;line-height:18px}
.thumb .del{position:absolute;top:5px;right:5px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.8);font-size:13px;display:none}
.thumb:hover .del,.thumb:focus-within .del{display:block}
.chartbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap}
.chartbar .seg{width:200px}
.skipbtn{height:62px;padding:0 24px;font-size:17px;border-radius:16px}
.chartbar .seg button{height:52px}
.hint{color:var(--dim);font-size:13.5px;margin-top:12px}

/* preview card */
.pcard{border:1px solid var(--line2);border-radius:24px;background:linear-gradient(180deg,#121214,#0a0a0b);padding:clamp(18px,2vw,28px);position:sticky;top:20px;min-width:0}
.pc-h{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;min-width:0;white-space:nowrap}
.pc-h .logo{width:30px;height:30px;font-size:11px;border-radius:8px}
.pc-h .dt{flex:none;margin-left:auto;color:var(--muted);font-weight:500;font-size:12.5px;display:flex;align-items:center;gap:8px}
.pc-h .dt .mini{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#1d1d20;border:1px solid var(--line2);font-size:10px;color:#ddd}
.pc-t{display:flex;align-items:center;gap:10px;margin:16px 0 14px;min-width:0;white-space:nowrap}
.pc-t .tk{font-size:26px;font-weight:700;letter-spacing:-.02em}
.badge{display:inline-block;padding:0 8px;border:1px solid var(--line2);border-radius:6px;background:#1a1a1d;font-size:12px;font-weight:600;line-height:22px}
.pc-t .ses{color:var(--muted);font-size:13.5px}
.pc-t .badge.tfb{margin-left:auto}
.dz{position:relative;aspect-ratio:1.22;border:1px dashed #2c2c30;border-radius:14px;background:radial-gradient(120% 90% at 50% 20%,#18181b,#09090a);display:grid;place-items:center;overflow:hidden;cursor:pointer}
.dz.drag{border-color:var(--win);background:#0f1426}
.dz .in{display:flex;flex-direction:column;align-items:center;gap:14px;color:#a6a6ab;font-size:14px;font-weight:500;text-align:center;padding:10px}
.dz .in .ib{display:grid;place-items:center;width:44px;height:44px;border-radius:11px;border:1px solid var(--line2);background:#141416}
.dz .in .ib svg{width:20px;height:20px}
.dz img{width:100%;height:100%;display:block}
.dz img.fit{object-fit:contain}.dz img.fill{object-fit:cover}
.dz .add{position:absolute;right:10px;bottom:10px;height:30px;padding:0 11px;border-radius:8px;background:rgba(0,0,0,.75);border:1px solid #3a3a3f;font-size:12.5px}
.dz.static{cursor:zoom-in}
.pc-s{display:flex;margin-top:14px;border:1px solid var(--line);border-radius:12px;background:#0d0d0e;padding:12px 2px}
.pc-s div{flex:1 1 auto;padding:0 8px;border-left:1px solid var(--line);min-width:0}
.pc-s div:first-child{border-left:0}
.pc-s div:last-child{flex-grow:2}
.pc-s span{display:block;color:var(--muted);font-size:10.5px;white-space:nowrap}
.pc-s b{display:block;font-size:13px;margin-top:6px;white-space:nowrap}
.pc-s div:last-child b{overflow:hidden;text-overflow:ellipsis}
.pc-f{display:flex;align-items:center;gap:12px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line)}
.pcard{container-type:inline-size}
.pc-s .ls{display:none}
@container (max-width:380px){.pc-s .lf{display:none}.pc-s .ls{display:inline}.pc-s{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));row-gap:14px}.pc-s div:nth-child(4){border-left:0}.pc-s b{overflow:hidden;text-overflow:ellipsis}}
.pc-f .stp{background:#fff;color:#000;border-radius:999px;padding:2px 10px;font-size:11.5px;font-weight:600}
.dashes{display:flex;gap:4px}
.dashes i{width:12px;height:2px;background:#333}
.dashes i.on{background:#fff}
.pc-f .br{margin-left:auto;font-size:12.5px;font-weight:600;color:#cfcfd3}
.pc-f .br::after{content:".";color:var(--win)}

/* exec calc */
.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px}
.calc .k{color:var(--muted);font-size:16px}
.calc>*{min-width:0}
.calc .v{font-size:clamp(24px,2.4vw,30px);font-weight:600;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.15}
.calc .v.lg{font-size:clamp(32px,3.4vw,48px);letter-spacing:-.02em}
.calc .v.dim{color:#8f8f94}
.rbox{width:220px}
.rbox .field{text-align:left;font-size:20px}
.risktag{display:flex}
.rtag{display:inline-flex;align-items:center;gap:8px;height:56px;padding:0 18px;border:1px solid var(--line2);border-radius:var(--r-md);background:var(--panel2);font-size:15px;white-space:nowrap}
.rtag:hover:not([disabled]):not(.on){border-color:#55555a}
.rtag.on{color:var(--muted);cursor:default}
.rtag svg{width:16px;height:16px}
.rtag[disabled]{opacity:.4;cursor:default}
.linkbtn{margin-left:8px;color:var(--text);text-decoration:underline;text-underline-offset:3px;font-size:inherit}
#riskhint{min-height:22px;line-height:1.6}
.okline{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.okline svg{width:14px;height:14px}
.tag{white-space:nowrap;display:inline-flex;align-items:center;height:34px;padding:0 12px;border:1px solid var(--line2);border-radius:9px;color:var(--muted);font-size:15px;background:#141416}
.tag.btnlike:hover{color:var(--text)}

/* gate & questions */
.gq{font-size:18px;font-weight:500;margin:0 0 8px;line-height:1.4;max-width:760px}
.gtag{font-size:15px;font-weight:600;margin-bottom:24px}
.qbars{display:flex;align-items:center;gap:8px;margin:22px 0 30px;color:var(--muted)}
.qbars i{width:64px;height:3px;border-radius:2px;background:#2a2a2e}
.qbars i.done{background:#8a8a90}
.qbars i.on{background:#fff}
.qbars span{margin-left:10px;font-size:15px}
.qtext{font-size:18px;font-weight:500;margin:0 0 14px;line-height:1.4}
.qwrap{max-width:1100px}
.notice{padding:22px;border:1px dashed var(--line2);border-radius:16px;color:var(--muted);max-width:640px}
.notice button{color:var(--text);text-decoration:underline}

/* review */
.rv{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:clamp(28px,3.4vw,52px);align-items:start;margin-top:34px}
.rv>*{min-width:0}
.rv .pcard{position:sticky;top:20px}
.rv-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 28px;flex-wrap:wrap;padding-bottom:28px;border-bottom:1px solid var(--line)}
.rv-h .t{font-size:clamp(38px,4vw,52px);font-weight:700;letter-spacing:-.03em;line-height:1}
.rv-h .t small{font-size:28px;font-weight:400;color:var(--muted);margin-left:14px;letter-spacing:0}
.rv-h .d{color:var(--muted);font-size:clamp(16px,1.5vw,19px);margin-top:12px}
.rv-h .big{white-space:nowrap;line-height:1}
.rv-h .big b{font-size:clamp(40px,4.6vw,62px);font-weight:700;letter-spacing:-.035em}
.rv-h .big span{font-size:clamp(22px,2.2vw,30px);font-weight:600;margin-left:14px}
.rrow{display:grid;grid-template-columns:150px minmax(0,1fr) 38px;gap:18px;align-items:start;padding:20px 0;border-bottom:1px solid var(--line)}
.rrow:first-child{padding-top:0}
.rrow .k{color:var(--muted);font-size:16px;padding-top:2px}
.rrow .v{font-size:17px;min-width:0;overflow-wrap:anywhere}
.rrow .sk{color:var(--muted);font-size:13px;margin:0 0 6px}
.rrow .chiplist+.sk{margin-top:14px}
.rrow .sk:not(:first-child){margin-top:14px}
.rrow .line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rrow .v .strong{font-weight:600;font-size:20px}
.rrow .v .sub{color:var(--muted);font-size:15px;margin-top:6px;white-space:pre-wrap}
.rrow .v .chiplist{display:flex;flex-wrap:wrap;gap:8px}
.rrow .v .chiplist span{padding:3px 10px;border:1px solid var(--line2);border-radius:8px;font-size:15px}
.rrow .icobtn{width:38px;height:38px;margin-top:-6px}
.qa{margin-top:12px}
.qa div{margin-bottom:14px}
.qa .q{color:var(--muted);font-size:15px}
.qa .a{font-size:16px;white-space:pre-wrap;margin-top:3px}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;margin-top:40px;padding-top:40px;border-top:1px solid var(--line)}
.strip .pcard{padding:18px 18px 16px;border-radius:18px;cursor:zoom-in}
.strip .pc-h{font-size:11.5px}
.strip .pc-h .logo{width:22px;height:22px;font-size:9px;border-radius:6px}
.strip .pc-t{margin:10px 0 10px}
.strip .pc-t .tk{font-size:17px}
.strip .badge{font-size:10.5px;line-height:18px}
.strip .stepname{color:var(--muted);font-size:12.5px;margin-top:10px}

/* modal */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);display:grid;place-items:center;padding:20px}
.modal{width:min(880px,100%);max-height:calc(100vh - 40px);overflow:auto;border:1px solid var(--line2);border-radius:24px;background:#0f0f10;padding:30px}
.modal h2{margin:0 0 6px;font-size:26px;font-weight:600;letter-spacing:-.02em}
.modal .lead{color:var(--muted);margin:0 0 24px}
.mrow{display:grid;grid-template-columns:1.4fr 1fr 1fr .8fr .9fr 40px;gap:10px;align-items:center;margin-bottom:10px}
.mrow .field{height:46px;font-size:15px;padding:0 12px;border-radius:11px}
.mf{display:block;min-width:0}
.mf span{display:none;color:var(--muted);font-size:12.5px;margin-bottom:5px}
.mrow.hd{color:var(--muted);font-size:13px;margin-bottom:6px}
.mfoot{display:flex;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap}
.lb{position:fixed;inset:0;z-index:60;background:#050505;display:flex;flex-direction:column;gap:12px;padding:calc(14px + env(safe-area-inset-top,0px)) 18px calc(14px + env(safe-area-inset-bottom,0px))}
.lb-top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;flex:none}
.lb-title{display:flex;align-items:baseline;gap:10px}
.lb-title b{font-size:17px;font-weight:600}
.lb-tools{display:flex;gap:10px;align-items:center}
.seg.sm.lbmode{width:auto}
.seg.sm.lbmode button{padding:0 16px;flex:none}
.lb-stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lb-stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
.lb-stage .nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;background:rgba(24,24,27,.92);border:1px solid var(--line2);font-size:24px}
.lb-stage .nav.l{left:4px}.lb-stage .nav.r{right:4px}
.lb-tf{position:absolute;left:12px;top:12px}
.lb-split{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.lb-pane{display:flex;flex-direction:column;min-height:0;min-width:0;border:1px solid var(--line2);border-radius:16px;background:#0b0b0c;padding:10px;cursor:pointer;transition:border-color .14s}
.lb-pane.on{border:2px solid #fff;padding:9px}
.lp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex:none}
.lp-side{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.lb-pane.on .lp-side{color:#fff}
.lp-h .grow{flex:1}
.lp-nav{width:40px;height:40px;border-radius:11px;border:1px solid var(--line2);font-size:22px;background:#161618}
.lp-nav:hover{border-color:#55555a}
.lp-img{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.lp-img img{max-width:100%;max-height:100%;object-fit:contain;border-radius:10px}
.lb-film{display:flex;gap:8px;overflow-x:auto;flex:none;padding:2px 2px 4px;scrollbar-width:thin}
.lb-film .lf:first-child{margin-left:auto}.lb-film .lf:last-child{margin-right:auto}
.lf{position:relative;flex:none;width:100px;height:64px;border-radius:10px;overflow:hidden;border:1px solid var(--line2);background:#0a0a0a;opacity:.7;transition:opacity .14s}
.lf:hover,.lf.used{opacity:1}
.lf.on{border:2px solid #fff;opacity:1}
.lf img{width:100%;height:100%;object-fit:cover;display:block}
.lf .tf{position:absolute;left:4px;bottom:4px;padding:0 5px;border-radius:5px;background:rgba(0,0,0,.82);font-size:11px;line-height:17px}
.lf .lr.r{left:auto;right:4px}
.lf .lr{position:absolute;left:4px;top:4px;width:18px;height:18px;border-radius:50%;background:#fff;color:#000;font-size:10.5px;font-weight:700;line-height:18px;text-align:center}
.lb-hint{color:var(--muted);font-size:13px;text-align:center;flex:none}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;padding:12px 18px;border:1px solid var(--line2);border-radius:12px;background:#18181b;box-shadow:0 12px 30px rgba(0,0,0,.6);font-size:14.5px}

/* ================= SHELL REDESIGN ================= */
:root{--bg:#0a0a0a;--panel:#141414;--panel2:#191919;--field:#1b1b1b;--line:#242424;--line2:#2e2e2e;--gain:#5fd37a;--rblue:#6f8cff}
body{font-family:"Inter","Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(1400px 900px at 85% -10%,#1a1a1a 0%,#0a0a0a 60%) fixed,#0a0a0a}
.pos{color:var(--gain)}
.rb{color:var(--rblue)}
.shell{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.sb{position:sticky;top:0;height:100vh;padding:24px 22px 22px 40px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.sb-log{display:flex;align-items:center;justify-content:center;gap:9px;height:42px;border-radius:999px;background:#fff;color:#000;font-weight:600;font-size:14.5px;margin-bottom:18px;flex:none}
.sb-log svg{width:16px;height:16px}
.sb-i{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 12px;border-radius:10px;color:#a3a3a8;font-size:14.5px;text-align:left;flex:none;transition:background .12s,color .12s}
.sb-i svg{width:17px;height:17px;flex:none}
.sb-i:hover{color:#fff}
.sb-i.on{background:#1d1d1d;color:#fff}
.sb2{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.sb2 .sb-i{height:34px;font-size:13.5px;color:#7d7d82}
.shmain{min-width:0}
.shmain .home{max-width:1260px;margin:0;padding:22px 32px 80px 28px}
.shmain .home.wide{max-width:1500px}
.pgh{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 26px}
.pgh h1{font-size:44px;font-weight:700;letter-spacing:-.035em;margin:0;line-height:1.05}
.pgh-sub{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13.5px;margin-top:9px}
.pgh-sub i{width:3px;height:3px;border-radius:50%;background:var(--dim)}
.pgh-sub b{color:var(--text);font-weight:600}
.pgh-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:4px}
.pgh-r .rtabs{padding:4px;border:1px solid var(--line2);border-radius:999px;background:var(--panel)}
.pgh-r .rtabs button{height:38px;padding:0 20px;border-radius:999px;font-size:14px}
.pgh-r select.field{height:46px;width:auto;min-width:130px;border-radius:12px;font-size:14px;padding:0 38px 0 14px}
.btn.pill{border-radius:999px;height:48px;padding:0 24px;font-weight:600;font-size:15px}
.gcard{border:1px solid var(--line);border-radius:24px;background:var(--panel);padding:22px 24px;margin-bottom:18px;min-width:0}
.gc-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.gc-h h2{font-size:19px;margin:0;font-weight:600;letter-spacing:-.01em}
.gc-h .mut{font-size:13px}
.lnk{color:var(--muted);font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.lnk:hover{color:var(--text)}
.kcard,.dcard{border-color:var(--line)}
.kcards{gap:18px}
/* journal */
.jgrid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;align-items:start;margin-bottom:24px}
.jgrid .dcard.cal{margin:0}
.cday.p{background:#1d3322;border-color:#2c5735}
.cday.l{background:#3a1c1e;border-color:#6a2c30}
.cday.n{background:#1c1c1c}

.cd-mid{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:3px;width:100%}

.cday.p .cd-p{color:#7ee38c}.cday.l .cd-p{color:#ff8a8f}
.cd-wl{font-size:11px;font-weight:600;letter-spacing:.02em;color:#cfcfd3}
.cday.p .cd-wl{color:#9fe8a9}.cday.l .cd-wl{color:#ffb1b4}
.cweek{justify-content:center}
.cw-v{font-size:15px;font-weight:600}.cw-s{color:var(--muted);font-size:11.5px;margin-top:2px}
.accp{padding:22px 20px}

.accp-c{display:block;width:100%;text-align:left;border:1px solid var(--line2);border-radius:16px;background:var(--panel2);padding:14px;margin-bottom:12px}

.accp-h{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px}
.acic{display:grid;place-items:center;width:26px;height:26px;border-radius:8px;border:1px solid var(--line2);background:#101010;font-size:9.5px;font-weight:700;flex:none}
.accp-m{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:var(--muted);font-size:13px}
.ebadge{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid #2f5d6b;background:#12262c;color:#bfe9f5}

/* entries + trade rows */
.ent-f,.tr-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.ent-f .rtabs{padding:3px;border:1px solid var(--line2);border-radius:999px}
.ent-f .rtabs button{height:32px;padding:0 14px;border-radius:999px;font-size:13.5px}
.selp{height:40px;width:auto;border-radius:12px;font-size:14px;padding:0 36px 0 14px;min-width:0}
.srch{position:relative;flex:1;min-width:200px;display:block}
.srch svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted);pointer-events:none}
.srch input{width:100%;height:42px;padding:0 14px 0 40px;border:1px solid var(--line2);border-radius:12px;background:var(--field);font-size:14px}

.trf-c{display:flex;flex-wrap:wrap;gap:8px}

.shell .wiz{max-width:none;padding:0}

.pp-f{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}

.lbad{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;border:1px solid #6a2c30;background:#2a1517;color:#ff8a8f;font-size:11.5px;font-weight:600}

.acg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,380px));gap:22px;margin-bottom:24px}

.acc2-b{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:20px}
.acc2-n{color:var(--muted);font-size:13.5px;margin-top:4px}

.acd-sub{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:13px}

.mt-g span{display:block;color:var(--muted);font-size:13px}.mt-g b{display:block;font-size:18px;font-weight:600;margin-top:6px}.mt-g small{display:block;color:var(--muted);font-size:12px;margin-top:4px}

/* ================= PROFESSIONAL THEME PASS ================= */
:root{
  --bg:#09090a;--panel:#111113;--panel2:#161618;--field:#18181b;--line:#222225;--line2:#2c2c30;
  --text:#ececee;--muted:#8a8a92;--dim:#55555c;
  --win:#4fb286;--gain:#4fb286;--loss:#de6870;--warn:#cf9f4f;--rblue:#4fb286;
  --win-bg:rgba(79,178,134,.09);--win-bd:rgba(79,178,134,.26);--win-tx:#74c7a0;
  --loss-bg:rgba(222,104,112,.09);--loss-bd:rgba(222,104,112,.26);--loss-tx:#e98a90;
  --warn-bg:rgba(207,159,79,.09);--warn-bd:rgba(207,159,79,.26);
  --neu-bg:rgba(255,255,255,.035);
}
body{background:radial-gradient(1200px 700px at 90% -15%,rgba(255,255,255,.045),transparent 60%) fixed,var(--bg);font-feature-settings:"cv11","ss01";letter-spacing:-.006em}
.kc-v,.e-r,.e-p,.cd-p,.cw-v,.acc2-b,.accp-b,.acd-k b,.trsum b,.dh-stats .v,.dh-grid .v,.mt-g b,.ss4 .v,.pvd-v .big,.num,td,.hv,.kv b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid rgba(255,255,255,.55)}
.pos,.rb{color:var(--win-tx)}.neg{color:var(--loss-tx)}
/* cards: one radius, one border, one surface */
.kcard,.dcard,.gcard,.acc2,.trsum,.ses4,.pvd,.frame{border-color:var(--line);background:var(--panel)}
.kcard,.dcard,.gcard,.trsum,.ses4{border-radius:20px}
.kcard{padding:22px 24px}
.kc-h{color:var(--muted);font-size:13.5px}
.kc-v{font-size:34px;font-weight:650;letter-spacing:-.03em}

.badge2.pos{background:var(--win-bg);border-color:var(--win-bd);color:var(--win-tx)}
.badge2.neg{background:var(--loss-bg);border-color:var(--loss-bd);color:var(--loss-tx)}
/* buttons */
.btn{background:var(--panel2);border-color:var(--line2);color:var(--text)}
.btn:hover{border-color:#45454b;background:#1a1a1d}
.btn.primary{background:#f2f2f3;border-color:#f2f2f3;color:#0a0a0a}
.btn.primary:hover{background:#fff}
.btn.danger{color:var(--loss-tx)}
.sb-log{background:#f2f2f3}
.field{background:var(--field);border-color:var(--line2)}
/* range segs */
.pgh-r .rtabs,.ent-f .rtabs,.pp-f .rtabs,.pvsw,.an-top .jd-ctrl .rtabs{background:var(--panel);border-color:var(--line2)}
.rtabs button.on,.pvsw button.on,.seg button.on{background:#232327;color:var(--text)}
/* calendar: subtle trend tints */
.cday,.cweek{background:#131315;border-color:var(--line)}
.cday.p{background:var(--win-bg);border-color:var(--win-bd)}
.cday.l{background:var(--loss-bg);border-color:var(--loss-bd)}
.cday.n{background:var(--neu-bg)}
.cday.p .cd-p{color:var(--win-tx)}.cday.l .cd-p{color:var(--loss-tx)}
.cday.p .cd-wl,.cday.l .cd-wl{color:var(--muted)}
.cd-wl{color:var(--muted)}
.cday.today{border:1.5px solid rgba(255,255,255,.7)}
.mc.p,.mcal .mc.p,.mcell.p{background:var(--win-bg);border-color:var(--win-bd)}
.mc.l,.mcal .mc.l,.mcell.l{background:var(--loss-bg);border-color:var(--loss-bd)}
.wdot.p{background:var(--win-bg);border-color:var(--win-bd);color:var(--win-tx)}
.wdot.l{background:var(--loss-bg);border-color:var(--loss-bd);color:var(--loss-tx)}
.legend i.p{background:var(--win-bg);border-color:var(--win-bd)}.legend i.l{background:var(--loss-bg);border-color:var(--loss-bd)}
/* tags & grades: process colour (good = green, bad = red), outcome colour on numbers */
.tagc.good,.chiplist span.goodtag{background:var(--win-bg);border-color:var(--win-bd);color:var(--win-tx)}
.gb{background:var(--neu-bg);border-color:var(--line2);color:#c9c9ce}
.gb.good{background:var(--win-bg);border-color:var(--win-bd);color:var(--win-tx)}
.gb.bad{background:var(--loss-bg);border-color:var(--loss-bd);color:var(--loss-tx)}

.erow:hover{background:#17171a;border-color:#34343a}
.pvd.p{border-color:var(--win-bd)}.pvd.l{border-color:var(--loss-bd)}
.pvd.p .pvd-v{background:linear-gradient(180deg,var(--win-bg),transparent)}.pvd.l .pvd-v{background:linear-gradient(180deg,var(--loss-bg),transparent)}
.pvd.today{border-color:rgba(255,255,255,.55)}
.dotb.bull{background:var(--win)}.dotb.bear{background:var(--loss)}
.ss4 .s.ok{color:var(--win-tx)}.ss4 .s.late{color:var(--loss-tx)}.ss4 .s.due{color:#dcb675}
.pp-miss{color:var(--loss-tx)}
.rbar i{background:#d9d9dc}.rbar.warn i{background:var(--warn)}.rbar.bad i{background:var(--loss)}

.nbx-col{min-width:0}
.nbx-t3{margin:0 0 10px;font-size:15px;font-weight:600}
.nbx-body{min-height:260px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel2);margin-bottom:14px}
.nbx-th{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.nbx-t{position:relative;width:96px;height:64px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:#0d0d0f}
.nbx-t.on{border-color:#fff}
.nbx-t img{width:100%;height:100%;object-fit:cover;display:block}
.nbx-t .tf{position:absolute;left:4px;bottom:4px;font-size:10.5px;font-weight:600;padding:1px 5px;border-radius:5px;background:rgba(0,0,0,.75);color:#fff}
.nbx-col .chartz{aspect-ratio:16/10}
@media (max-width:1000px){.nbx-grid{grid-template-columns:minmax(0,1fr)}}

/* process checklist */
.pr-wrap{display:flex;flex-direction:column;gap:clamp(10px,2.2vh,24px)}
.pr-top{display:flex;align-items:center;gap:clamp(14px,2vw,26px)}
.pr-ring{flex:none;width:clamp(104px,17vh,160px);aspect-ratio:1}
.pr-ring.sm{width:88px}.pr-ring.xs{width:84px}
.pr-ring svg{width:100%;height:100%;display:block}
.pr-sub{color:var(--muted);font-size:15px;margin-top:6px}
.pr-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,2vw,28px);align-items:start}
.pr-g h3{margin:0 0 6px;font-size:15px;font-weight:600;color:#cfcfd3}
.pr-i{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:clamp(40px,6.2vh,56px);padding:3px 8px;border-radius:12px}
.pr-i:hover{background:#17171a}
.pr-b{flex:none;width:clamp(28px,4.2vh,38px);aspect-ratio:1;border-radius:9px;border:2px solid #4a4a50;display:grid;place-items:center;color:#0a0a0a;transition:background .12s,border-color .12s}
.pr-b svg{width:72%;height:72%;opacity:0}
.pr-i.on .pr-b{background:var(--pc);border-color:var(--pc)}.pr-i.on .pr-b svg{opacity:1}
.pr-l{font-size:clamp(15px,2.2vh,18px);line-height:1.25}
@media (max-width:900px){.pr-grid{grid-template-columns:1fr;gap:2px}.pr-g h3{margin:8px 0 2px}.pr-i{min-height:clamp(32px,4.7vh,44px);gap:12px}.pr-b{width:clamp(26px,3.8vh,32px)}.pr-ring{width:clamp(92px,13vh,120px)}}
.pr-auto{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.pr-auto b{font-size:22px}
.pr-flex{display:flex;align-items:center;justify-content:space-between;gap:16px}.pr-main{flex:1;min-width:0}
.pr-mini{display:flex;align-items:center;gap:16px;margin-bottom:6px}.pr-mini-t{display:flex;flex-direction:column;gap:3px}
.pr-chips span.ok{color:var(--win-tx)}.pr-chips span.bad{color:var(--loss-tx)}

/* expense receipts */
.exf-box{display:flex;flex-direction:column;gap:10px}
.exf-lbl{font-size:13px;color:var(--muted)}
.exf-dz{display:flex;flex-direction:column;gap:4px;align-items:center;justify-content:center;text-align:center;min-height:84px;padding:14px;border:1px dashed #3a3a40;border-radius:14px;background:#101012;cursor:pointer;font-weight:500}
.exf-dz small{color:var(--muted);font-weight:400;font-size:12px}.exf-dz.drag{border-color:var(--win)}.exf-dz:hover{border-color:#5a5a62}
.exf-list{display:flex;flex-direction:column;gap:8px}
.exf{display:flex;align-items:center;gap:12px;padding:8px;border:1px solid var(--line2);border-radius:12px;background:var(--panel2)}
.exf-v{flex:none;width:72px;height:56px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);background:#0d0d0f;display:grid;place-items:center}
.exf-v img{width:100%;height:100%;object-fit:cover;display:block}
.exf-ic{font-size:13px;font-weight:700;color:#cfcfd3;letter-spacing:.04em}
.exf-m{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}.exf-m b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
button.tg.exf-badge{cursor:pointer}

/* light theme: the whole interface is inverted, charts and photos are turned back so they keep their real colours */
html[data-theme="light"]{filter:invert(1) hue-rotate(180deg)}
html[data-theme="light"] img,html[data-theme="light"] video{filter:invert(1) hue-rotate(180deg)}
html{transition:none}

/* process marks on the calendar, custom ranges */
.cd-n{display:flex;align-items:center;gap:7px}
.cd-pm{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;font-size:11px;font-style:normal;font-weight:800;line-height:1;flex:none}
.cd-pm.ok{background:#30a46c;color:#04180d}.cd-pm.part{background:#e5a024;color:#201300}.cd-pm.no{background:#e5484d;color:#fff}
.cw-pr{font-size:15px;font-weight:700;margin-top:6px}
.cal-pr{padding:2px 26px 0;color:var(--muted);font-size:13.5px;display:flex;align-items:center;gap:8px}
.cal-pr b{font-weight:600}
.crng{display:inline-flex;align-items:center;gap:8px}.crng i{font-style:normal;color:var(--muted);font-size:13px}
.crng input.field{width:auto;height:38px;padding:0 10px;font-size:13.5px}
.pvd-h b{display:inline-flex;align-items:center;gap:7px}

.pr-q{margin-left:auto;min-width:260px;max-width:340px;flex:1}
.pr-q .seg{width:100%}.pr-q .seg button{flex:1}
.pr-q .seg button.on.good{background:#1d3322;color:#7ee38c}
.pr-q .seg button.on.bad{background:#3a1c1e;color:#ff8a8f}
@media (max-width:900px){.pr-top{flex-wrap:wrap}.pr-q{margin-left:0;max-width:none;flex-basis:100%;min-width:0}}

async function sbRequest(path,{method='GET',body,headers={},raw=false}={}){

    catch(e){throw Error('Network unavailable; cloud data has NOT been replaced with local data')}
    if(!response.ok){const msg=await response.text();throw Error('Supabase '+response.status+': '+msg.slice(0,350))}
    const result=raw?response:await response.text().then(t=>t?JSON.parse(t):null);

    if(writing&&!Store.cloudError){Store.syncVerified=true}

async function saveFile(filename,data,mime){
  if(Store.downloads){
    try{await Store.downloads.save({filename,data});toast('Exported '+filename);return}
    catch(e){
      const c=e&&e.code;
      if(c==='declined')return;
      if(c==='rate_limited'){toast('Another save is still open, try again in a moment');return}
      if(c==='too_large'){toast('That file is too large, try the data-only export');return}
      if(!['unavailable','not_granted','capability_disabled','capability_removed'].includes(c)){toast('Export failed: '+((e&&e.message)||c||'unknown error'));return}
    }
  }
  const blob=data instanceof Blob?data:new Blob([data],{type:mime});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}

/* ============================================================
   CALCULATIONS
   ============================================================ */
function calc(t){
  const e=t.exec||{};let r=null,pnl=null,outcome='Open';
  if(e.resultType==='R'&&e.r!=null){r=+e.r;pnl=r*(+e.risk||0);outcome=r>0?'Win':r<0?'Loss':'B/E'}
  else if(e.resultType==='BE'){r=0;pnl=0;outcome='B/E'}
  else if(e.resultType==='NT'){outcome='No trade'}
  const pv=PV[t.instrument];
  const size=(pv&&e.stop>0&&e.risk>0)?e.risk/(e.stop*pv):null;
  const rr=r!=null&&r>0?'1:'+(+r.toFixed(2)):null;
  const word={Win:'win',Loss:'loss','B/E':'loss','No trade':'pass'}[outcome];
  const shown={Win:'win',Loss:'loss','B/E':'B/E','No trade':'pass'}[outcome];
  const setKey=(t.gate==null||!word)?null:(t.gate?'good ':'bad ')+word;
  const grade=setKey?(t.gate?'Good ':'Bad ')+shown:null;
  const questions=setKey?QSETS[setKey]:null;
  const answered=(t.answers||[]).filter(a=>a&&a.trim()).length;
  return{r,pnl,outcome,size,rr,grade,questions,answered};
}
const MICRO={NQ:'MNQ',ES:'MES',YM:'MYM',RTY:'M2K',GC:'MGC',CL:'MCL',SI:'SIL'};
const FULLOF=Object.fromEntries(Object.entries(MICRO).map(([a,b])=>[b,a]));
function sizeLabel(t,c){
  const e=t.exec;if(!(e.risk>0&&e.stop>0))return '–';
  if(FX.has(t.instrument)&&!t.instrument.startsWith('6'))return c.size==null?'–':(+c.size.toFixed(2))+' lots';
  const eps=1e-9;const full=FULLOF[t.instrument]||t.instrument;const micro=MICRO[full];
  if(micro&&PV[full]&&PV[micro]){
    const n=Math.floor(e.risk/(e.stop*PV[full])+eps);
    const rem=e.risk-n*e.stop*PV[full];
    const m=Math.floor(rem/(e.stop*PV[micro])+eps);
    return `${n} ${full}, ${m} ${micro}`;
  }
  const pv=PV[t.instrument];if(!pv)return '–';
  return Math.floor(e.risk/(e.stop*pv)+eps)+' '+t.instrument;
}

function mergeOpt(cur,inc){const o=initOpt(cur);if(!inc)return;const add=(a,b)=>{for(const v of b||[])if(v&&!a.includes(v))a.push(v)};

    for(const [k,list] of Object.entries(I.dd||{})){if(!P.dd[k])P.dd[k]=[];add(P.dd[k],list)}add(P.checks,I.checks);add(P.div,I.div)};

/* ---------- trade draft autosave ---------- */
let tdTimer=null;
const stripV=o=>{const c=clone(o||{});delete c.visited;delete c.skipped;return JSON.stringify(c)};
function scheduleTradeDraft(){if(S.view!=='wizard'||!S.draft)return;clearTimeout(tdTimer);tdTimer=setTimeout(saveTradeDraft,700)}
async function saveTradeDraft(){
  clearTimeout(tdTimer);if(S.view!=='wizard'||!S.draft)return;
  if(!S.editing&&!S.resumed&&stripV(S.draft)===stripV(S.original))return;
  if(S.editing&&!S.resumed&&stripV(S.draft)===stripV(S.original))return;
  const body={kind:'tdraft',draft:clone(S.draft),editing:S.editing,step:S.step,newRefs:[...S.newRefs],removedRefs:[...S.removedRefs],savedAt:new Date().toISOString()};
  try{await writeKv('tdraft',body)}catch(e){}
}
async function clearTradeDraft(){clearTimeout(tdTimer);S.tdraft=null;S.resumed=false;try{await writeKv('tdraft',null)}catch(e){}}
function resumeTradeDraft(){
  const d=S.tdraft;if(!d)return;const orig=d.editing?S.trades.find(x=>x.id===d.draft.id):null;
  S.draft=clone(d.draft);ensureMgmt(S.draft);
  if(S.draft&&!S.draft.hourly)S.draft.hourly={text:'',notes:''};S.editing=!!orig;S.original=orig?clone(orig):{};S.step=Math.min(STEPS.length-1,d.step||0);S.qi=0;S.ui=freshUi();S.ui.mktTab=S.draft.market;
  S.newRefs=new Set(d.newRefs||[]);S.removedRefs=new Set(d.removedRefs||[]);S.resumed=true;S.tdraft=null;S.view='wizard';S.enter=true;render();scrollTo(0,0);
}
async function discardTradeDraft(){const d=S.tdraft;if(!d)return;if(!confirm('Discard this unsaved trade? Its charts will be removed too.'))return;
  for(const r of d.newRefs||[])await delImage(r);await clearTradeDraft();render();toast('Unsaved trade discarded')}
function loadBanner(){return S.loadFailed?`<div class="loadwarn" role="alert"><b>Your journal didn't load completely.</b> Nothing was changed or deleted. Reload the page. If this keeps happening, use Import with your latest backup.</div>`:''}
function draftBanner(){const d=S.tdraft;if(!d||!d.draft)return '';const t=d.draft;const c=calc(t);
  return `<section class="dcard drbanner" role="status"><div class="dr-b"><span class="ul-ic">${ICONS.pen}</span><div class="dr-t"><b>You have an unsaved trade</b><span class="mut">${esc(t.ticker||t.instrument)} ${esc(t.direction)}, ${esc(dateShort(t))}${c.r!=null?', '+fmtR(c.r):''} · ${d.editing?'Changes to a saved trade':'New trade'} · last edited ${new Date(d.savedAt).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span></div><div class="row" style="gap:10px"><button class="btn" data-act="td-discard">Discard</button><button class="btn primary" data-act="td-resume">Resume</button></div></div></section>`}
function nbLastDefaults(d){const last=(S.trades||[]).reduce((m,x)=>!m||((x.date||'')+(x.time||''))>((m.date||'')+(m.time||''))?x:m,null);
  if(!last)return;const k=acctKind(last);if(k==='Funded'||k==='Evaluation')d.accountKind=k;if(last.exec&&last.exec.risk!=null)d.exec.risk=last.exec.risk}
function startNew(){if(S.tdraft&&!confirm('You have an unsaved trade. Start a new one and discard it?'))return;if(S.tdraft){const old=S.tdraft;(old.newRefs||[]).forEach(r=>delImage(r));clearTradeDraft()}S.resumed=false;S.draft=newTrade();nbLastDefaults(S.draft);S.original=clone(S.draft);S.editing=false;S.step=0;S.qi=0;S.ui=freshUi();S.ui.mktTab=S.draft.market;S.newRefs=new Set();S.removedRefs=new Set();S.view='wizard';render();scrollTo(0,0)}
function openTrade(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return;
  if(S.tdraft&&S.tdraft.draft&&S.tdraft.draft.id===id){resumeTradeDraft();toast('Picked up your unsaved changes');return}
  if(S.tdraft){if(!confirm('You have an unsaved trade. Open this one and discard it?'))return;(S.tdraft.newRefs||[]).forEach(r=>delImage(r));clearTradeDraft()}
  ensureMgmt(t);
  S.resumed=false;S.draft=clone(t);S.original=clone(t);S.editing=true;S.step=STEPS.length-1;S.qi=0;S.ui=freshUi();S.ui.mktTab=t.market;
  STEPS.forEach(s=>S.draft.visited[s.k]=true);
  S.newRefs=new Set();S.removedRefs=new Set();S.view='wizard';render();scrollTo(0,0);
}
function goStep(i){
  i=Math.max(0,Math.min(STEPS.length-1,i));
  S.step=i;S.qi=0;S.ui.ownOpen=null;S.anaUi={own:null,add:null};S.draft.visited[STEPS[i].k]=true;S.enter=true;render();scrollTo(0,0);
}
function next(){
  const st=STEPS[S.step];
  if(st.k==='questions'&&calc(S.draft).questions&&S.qi<2){S.qi++;S.enter=true;render();return}
  goStep(S.step+1);
}
function back(){
  const st=STEPS[S.step];
  if(st.k==='questions'&&S.qi>0){S.qi--;S.enter=true;render();return}
  if(S.step===0)return;
  const prev=S.step-1;
  if(STEPS[prev].k==='questions'&&calc(S.draft).questions){S.step=prev;S.qi=2;S.enter=true;render();scrollTo(0,0);return}
  goStep(prev);
}
async function addImages(files){
  const st=STEPS[S.step];if(!st||!st.chart)return;
  const ok=[...files].filter(f=>OK_TYPES.includes(f.type));
  if(!ok.length){toast('Use a PNG, JPG, WebP or GIF image');return}
  S.uploading+=ok.length;softUpdate();
  for(const f of ok){
    try{
      const ref=await putImage(f);
      S.newRefs.add(ref);
      S.draft.images.push({ref,step:st.k,tf:S.ui.tf[st.k],addedAt:new Date().toISOString()});
      S.ui.sel[st.k]=ref;delete S.draft.skipped[st.k];
    }catch(e){toast('Could not store that image')}
    S.uploading--;
  }
  if(S.view==='wizard'&&STEPS[S.step].k===st.k)render();
}
async function cancelWizard(){
  const strip=o=>{const c=clone(o);delete c.visited;delete c.skipped;return JSON.stringify(c)};
  const dirty=strip(S.draft)!==strip(S.original);
  if(dirty&&!confirm(S.editing?'Close without saving your changes?':'Discard this trade?'))return;
  for(const r of S.newRefs)await delImage(r);
  await clearTradeDraft();
  if(S.returnToPlanId){const id=S.returnToPlanId;S.returnToPlanId=null;S.draft=null;openPlan(id);return}
  S.view='home';S.draft=null;render();
}
async function saveDraft(){
  const t=S.draft;const now=new Date().toISOString();
  t.updatedAt=now;if(!t.createdAt)t.createdAt=now;
  try{await saveTradeDoc(t)}catch(e){toast('Save failed: '+((e&&e.message)||e&&e.code||'unknown error'));return}
  for(const r of S.removedRefs)await delImage(r);
  const i=S.trades.findIndex(x=>x.id===t.id);if(i>=0)S.trades[i]=clone(t);else S.trades.push(clone(t));
  await clearTradeDraft();
  if(S.returnToPlanId){const id=S.returnToPlanId;S.returnToPlanId=null;S.draft=null;S.newRefs=new Set();S.removedRefs=new Set();openPlan(id);toast('Trade saved');return}
  S.view='home';S.draft=null;S.newRefs=new Set();S.removedRefs=new Set();render();scrollTo(0,0);
  toast('Trade saved');
}
async function deleteTrade(id){
  const t=S.trades.find(x=>x.id===id);if(!t)return false;
  if(!confirm(`Delete ${t.ticker||t.instrument} ${t.direction} on ${dateShort(t)}? This also removes its charts.`))return false;
  try{await deleteTradeDoc(t)}catch(e){toast('Delete failed');return false}
  for(const im of t.images)await delImage(im.ref);
  S.trades=S.trades.filter(x=>x.id!==id);render();toast('Trade deleted');return true;
}

async function exportShape(t,withImages){
  const c=calc(t);

  for(const x0 of arr){const c0=x0&&typeof x0==='object'?clone(x0):null;if(!c0)continue;const old0=S.expenses.find(o=>o.id===c0.id);const incF=(Array.isArray(c0.files)?c0.files:[]).filter(f=>f&&f.data);
    if(old0&&!isNewer(c0.updatedAt,old0.updatedAt)){if((c0.updatedAt||'')===(old0.updatedAt||'')&&incF.length>(old0.files||[]).length){const fs=await uplImgs(incF,(ref,f)=>({ref,name:f.name||'File',type:f.mime||f.type||'',size:f.size||0,addedAt:f.addedAt||null}));if(fs.length>(old0.files||[]).length){const prev=old0.files||[];old0.files=fs;try{await saveExpDoc(old0);n++;prev.forEach(f=>delImage(f.ref).catch(()=>{}))}catch(e){old0.files=prev;fs.forEach(f=>delImage(f.ref).catch(()=>{}))}}else fs.forEach(f=>delImage(f.ref).catch(()=>{}))}continue}
    if(old0&&!incF.length){c0.files=clone(old0.files||[])}const dropRefs=old0&&incF.length?(old0.files||[]).map(f=>f.ref):[];
    if(Array.isArray(c0.files)){const fs=[];for(const f of c0.files){if(!f)continue;if(f.data){try{fs.push({ref:await putImage(dataUrlToBlob(f.data)),name:f.name||'File',type:f.mime||f.type||'',size:f.size||0,addedAt:f.addedAt||null})}catch(e){XFER.fail++}}else if(typeof f.ref==='string')fs.push({ref:f.ref,name:f.name||'File',type:f.type||'',size:f.size||0,addedAt:f.addedAt||null})}c0.files=fs}
    const x=normExpense(c0);if(!x)continue;const old=S.expenses.find(o=>o.id===x.id);const v=x;if(old)Object.assign(old,v);else S.expenses.push(v);try{await saveExpDoc(v);n++;dropRefs.forEach(r=>delImage(r).catch(()=>{}))}catch(e){}}
  return n}
const isNewer=(a,b)=>String(a||'')>String(b||'');
const XFER={miss:0,fail:0};
async function uplImgs(list,map){const out=[];for(const im of list||[]){if(im&&im.data){try{out.push(map(await putImage(dataUrlToBlob(im.data)),im))}catch(e){XFER.fail++}}}return out}
async function importFiles(files){XFER.fail=0;
  const list=[...files].sort((a,b)=>a.name.localeCompare(b.name)||a.lastModified-b.lastModified);
  const tot={n:0,pn:0,dn:0,gn:0,xn:0};let bad=0,ok=0,i=0;
  for(const f of list){i++;toast(`Importing file ${i} of ${list.length}…`);let d=null;try{d=JSON.parse(await f.text())}catch(e){d=null;toast(`Could not read ${f.name}. If it is very large, export that period in smaller parts.`);await new Promise(r=>setTimeout(r,1500))}
    if(!d||typeof d!=='object'){bad++;continue}const r=await importJson(null,{data:d,quiet:true});d=null;if(r){ok++;for(const k in tot)tot[k]+=r[k]||0}else bad++}
  S.dayDoc=null;render();
  const parts=[tot.n?pl(tot.n,'trade'):'',tot.pn?pl(tot.pn,'plan'):'',tot.dn?pl(tot.dn,'day'):'',tot.gn?pl(tot.gn,'notebook page'):'',tot.xn?pl(tot.xn,'expense entry','expense entries'):''].filter(Boolean);
  toast(`${pl(ok,'file')} imported${parts.length?': '+parts.join(', '):', nothing new'}${bad?` · ${pl(bad,'file')} could not be read`:''}`);
  if(XFER.fail){const m=XFER.fail;setTimeout(()=>toast(`Warning: ${pl(m,'chart')} could not be uploaded (storage full or offline). Free some space and import the same files again: only the missing charts are added.`),2200)}}
async function importJson(text,opt={}){
  let data=opt.data;if(!data){try{data=JSON.parse(text)}catch(e){toast('That file is not valid JSON');return}}
  if(!data||(!Array.isArray(data.trades)&&!Array.isArray(data.plans)&&!Array.isArray(data.days)&&!Array.isArray(data.pages)&&!Array.isArray(data.expenses)&&!data.settings)){if(!opt.quiet)toast('Nothing to import in that file');return}
  if(!opt.quiet){XFER.fail=0;toast('Importing…')}
  const an=await importSettings(data.settings);
  const pn=await importPlans(data.plans);const dn=await importDays(data.days);const gn=await importPages(data.pages);const xn=await importExpenses(data.expenses);
  if(Array.isArray(data.accounts)){for(const a of data.accounts){if(a&&a.id&&!acctById(a.id))S.settings.accounts.push({id:a.id,name:a.name||'Account',firm:a.firm||'',type:ACCT_TYPES.includes(a.type)?a.type:'Other',number:a.number||'',risk:a.risk??null})}}
  let n=0;
  for(const x of Array.isArray(data.trades)?data.trades:[]){
    if(!x||typeof x!=='object')continue;const raw=x._raw;let t;
    if(raw&&raw.kind==='trade'){t=normTrade({...newTrade(),...raw,images:[]});if(!t)continue}
    else continue; /* only full exports (with _raw) can be re-imported */
    if(x.account&&x.account.id&&!acctById(x.account.id))S.settings.accounts.push({id:x.account.id,name:x.account.name,firm:x.account.firm,type:ACCT_TYPES.includes(x.account.type)?x.account.type:'Other',number:x.account.number,risk:x.account.defaultRisk});
    const old=S.trades.find(o=>o.id===t.id);const inc=(Array.isArray(x.images)?x.images:[]).filter(im=>im&&im.data);
    const mapT=(ref,im)=>({ref,step:im.step,tf:im.timeframe,addedAt:im.addedAt});
    if(old){const nw=isNewer(t.updatedAt,old.updatedAt);const restore=(t.updatedAt||'')===(old.updatedAt||'')&&inc.length>(old.images||[]).length;
      if(!nw&&!restore)continue;
      if(!nw){const ims=await uplImgs(inc,mapT);if(ims.length<=(old.images||[]).length){ims.forEach(i=>delImage(i.ref).catch(()=>{}));continue}const o2={...old,images:ims};try{await saveTradeDoc(o2)}catch(e){ims.forEach(i=>delImage(i.ref).catch(()=>{}));continue}(old.images||[]).forEach(i=>delImage(i.ref).catch(()=>{}));S.trades[S.trades.indexOf(old)]=o2;n++;continue}
      if(inc.length){t.images=await uplImgs(inc,mapT);try{await saveTradeDoc(t)}catch(e){t.images.forEach(i=>delImage(i.ref).catch(()=>{}));continue}for(const im of old.images||[])await delImage(im.ref).catch(()=>{})}
      else{t.images=old.images||[];try{await saveTradeDoc(t)}catch(e){continue}}
      S.trades[S.trades.indexOf(old)]=t}
    else{t.images=await uplImgs(inc,mapT);try{await saveTradeDoc(t)}catch(e){t.images.forEach(i=>delImage(i.ref).catch(()=>{}));continue}S.trades.push(t)}
    n++;
  }
  await saveSettings().catch(()=>{});
  S.acEdit=null;S.dayDoc=null;
  if(opt.quiet)return{n,pn,dn,gn,xn};
  render();toast(n||pn||dn||an||gn||xn?`Imported ${[n?pl(n,'trade'):'',pn?pl(pn,'plan'):'',dn?pl(dn,'day'):'',gn?pl(gn,'notebook page'):'',xn?pl(xn,'expense entry','expense entries'):''].filter(Boolean).join(', ')}`:'Nothing new to import. Everything in that file is already here.');
  if(XFER.fail){const m=XFER.fail;setTimeout(()=>toast(`Warning: ${pl(m,'chart')} could not be uploaded (storage full or offline). Free some space and import the same file again: only the missing charts are added.`),2200)}
}

function etOffsetMin(d){
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',hourCycle:'h23',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}).formatToParts(d);
  const g=k=>+parts.find(x=>x.type===k).value;
  return Math.round((Date.UTC(g('year'),g('month')-1,g('day'),g('hour')%24,g('minute'))-d.getTime())/60000);
}
function etToDate(ds,hhmm,shift){const [y,m,d]=ds.split('-').map(Number);const [h,mi]=hhmm.split(':').map(Number);const guess=Date.UTC(y,m-1,d+shift,h,mi);return new Date(guess-etOffsetMin(new Date(guess))*60000)}

  const ring=ps.np?`<div class="pr-ring xs" title="Average process completion">${procRing(Math.round(ps.avg),Math.round(ps.avg/100*PROC_ALL.length))}</div>`:'';
  return `<div class="proc"><div class="pr-flex"><div class="pr-main"><div class="proc-h"><span>Process followed</span><b class="proc-v ${c}">${ps.fol}/${ps.n}</b><span class="proc-p ${c}">${pctTxt(ps.exact)}</span></div>
    <div class="proc-bar"><i class="${c}" style="width:${Math.max(2,ps.exact)}%"></i></div>
    <div class="proc-s">${ps.fol} of ${pl(ps.n,'trade')} had the full process${ps.off?` · ${ps.off} incomplete`:''}${ps.open?` · ${ps.open} not answered`:''}${ps.np?` · average ${pctTxt(ps.avg)} ticked`:''}${ps.n?` <span class="mut">·</span> <span class="${cls(ps.pnlFol)}">${fmtUsd(ps.pnlFol)}</span> full${ps.off?` <span class="mut">/</span> <span class="${cls(ps.pnlOff)}">${fmtUsd(ps.pnlOff)}</span> incomplete`:''}`:''}</div></div>${ring}</div></div>`}
const planCls=p=>p==null?'':p>=80?'pos':p>=60?'':'neg';
function planPill(t,short){if(t.followedPlan==null)return '';const h=procHas(t),p=procPct(t);return t.followedPlan?`<span class="plpill ok" title="Full process followed">${short?'✓':'✓ '+(h?'100%':'Process')}</span>`:`<span class="plpill bad" title="Process not complete">${short?'✗':'✗ '+(h?p+'%':'Process')}</span>`}
function planKpi(ts){const ps=planStat(ts);

function dayStats(ts){
  const cs=ts.map(t=>({t,c:calc(t)}));
  const taken=cs.filter(x=>['Win','Loss','B/E'].includes(x.c.outcome));
  const passes=cs.filter(x=>x.c.outcome==='No trade').length;
  const wins=taken.filter(x=>x.c.outcome==='Win').length,losses=taken.filter(x=>x.c.outcome==='Loss').length,be=taken.length-wins-losses;
  const netP=cs.reduce((a,x)=>a+(x.c.pnl||0),0),netR=cs.reduce((a,x)=>a+(x.c.r||0),0);
  const graded=cs.filter(x=>x.c.grade),good=graded.filter(x=>x.c.grade.startsWith('Good')).length;
  const gw=taken.reduce((a,x)=>a+Math.max(0,x.c.pnl||0),0),gl=taken.reduce((a,x)=>a+Math.min(0,x.c.pnl||0),0);
  const risks=taken.map(x=>+x.t.exec.risk).filter(v=>v>0);
  const rs=taken.map(x=>x.c.r).filter(v=>v!=null);
  const lw=rs.filter(r=>r>0),ll=rs.filter(r=>r<0);
  return{count:ts.length,taken:taken.length,passes,wins,losses,be,netP,netR,
    winRate:taken.length?Math.round(wins/taken.length*100):null,goodPct:graded.length?Math.round(good/graded.length*100):null,
    grossWin:gw,grossLoss:gl,avgRisk:risks.length?risks.reduce((a,b)=>a+b,0)/risks.length:null,
    largestWin:lw.length?Math.max(...lw):null,largestLoss:ll.length?Math.min(...ll):null};
}

function renderMonth(){

    <div class="cgrid ${seven?'c7':'c5'}">${heads}${rows.join('')}</div>
  </section>`;
}

function anMetrics(ts){

    const safe=(fn,kind)=>trades.filter(x=>x&&x.kind===kind).map(x=>{try{return fn(x)}catch(e){console.warn('repair failed',kind,e);return x}}).filter(Boolean);
    S.trades=safe(normTrade,'trade');S.trades.forEach(t=>{if(!t.hourly)t.hourly={text:'',notes:''}});
    S.plans=safe(normalizePlan,'plan');S.days=safe(normDay,'day');S.pages=safe(normPage,'page');S.expenses=safe(normExpense,'expense');
    if(settings&&baked&&settings.bakeSeen!==baked.id){mergeBaked(S.settings,baked.settings);S.settings.bakeSeen=baked.id;await saveSettings().catch(()=>{})}
    if(!settings&&baked)await saveSettings().catch(()=>{});
    initOpt(S.settings);
    S.settings.custom=Object.assign({context:[],levels:[],cracks:[],entry:[],mgmt:[],exit:[]},S.settings.custom||{});
    S.settings.due=Object.assign({},DUE_DEFAULT,S.settings.due||{});
    await nbEnsure();
    const hadLists=!!S.settings.tagLists;const tlv=S.settings.tagListsV||1;ensureTagLists(S.settings);if(!S.settings.cleanedV3){const rx=/^\s*(2|two)[\s-]*stage[\s-]*(cic|ciC|CiC)\s*$/i;for(const k of Object.keys(S.settings.custom||{}))if(Array.isArray(S.settings.custom[k]))S.settings.custom[k]=S.settings.custom[k].filter(v=>!rx.test(v));for(const k of Object.keys(S.settings.tagLists||{}))S.settings.tagLists[k]=S.settings.tagLists[k].filter(v=>!rx.test(v));S.settings.cleanedV3=true;await saveSettings().catch(()=>{})}if((!hadLists||tlv<3)&&settings)await saveSettings().catch(()=>{});
    if(!settings)await saveSettings().catch(()=>{});
  }catch(e){console.error('load failed',e);S.loadFailed=true;S.trades=S.trades||[];S.plans=S.plans||[];S.days=S.days||[];S.pages=S.pages||[];S.expenses=S.expenses||[];
    if(Store.mode==='cloud'){Store.cloudError='Cloud loading failed: '+(e.message||e);S.loadFailed=true;}if(!S.settings||!Array.isArray(S.settings.accounts))S.settings=defaultSettings();S.settings.due=S.settings.due||{...DUE_DEFAULT};try{ensureTagLists(S.settings);initOpt(S.settings)}catch(e2){}}
  S.loading=false;render();if(Store.cloudError&&Store.mode==='cloud'){document.getElementById('app').innerHTML='<div style="padding:35px;max-width:650px;margin:auto"><h2>Cloud journal unavailable</h2><p>'+esc(Store.cloudError)+'</p><p>Nothing has been switched to local mode. Check your connection or Supabase configuration, then refresh.</p></div>';}showSyncStatus();if(Store.authError)toast(Store.authError);
})();
